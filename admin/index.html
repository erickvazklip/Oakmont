<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Leads | Oakmont Services</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Montserrat:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="adm-body">
  <header class="adm-top">
    <div class="container">
      <a href="../" class="wordmark" aria-label="Oakmont Services — sitio"><span class="wordmark__name">OAKMONT</span><span class="wordmark__sub">SERVICES</span></a>
      <span class="adm-top__title">Panel de leads</span>
    </div>
  </header>

  <main class="adm container">
    <h1>Leads del formulario de contacto</h1>

    <form class="adm-login" id="login" hidden>
      <label class="field"><span>Contraseña de administración</span><input type="password" name="pw" autocomplete="current-password" required></label>
      <button class="btn btn--dark btn--lg" type="submit">Entrar</button>
      <p class="adm-err" id="login-err" role="alert" hidden></p>
    </form>

    <section id="panel" hidden>
      <div class="adm-bar">
        <input type="search" id="q" placeholder="Buscar por nombre, empresa, correo o tema" aria-label="Buscar leads">
        <button class="btn btn--dark btn--sm" id="csv" type="button">Exportar CSV</button>
        <button class="btn btn--line-dark btn--sm" id="reload" type="button">Actualizar</button>
        <button class="btn btn--line-dark btn--sm" id="logout" type="button">Salir</button>
        <span class="adm-count" id="count" aria-live="polite"></span>
      </div>
      <div class="adm-wrap">
        <table class="adm-table">
          <thead><tr><th scope="col">Fecha</th><th scope="col">Nombre</th><th scope="col">Empresa</th><th scope="col">Cargo</th><th scope="col">Correo</th><th scope="col">Teléfono</th><th scope="col">Interés</th><th scope="col"><span class="visually-hidden">Acciones</span></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="adm-empty" id="empty" hidden>Todavía no hay leads registrados.</p>
      <p class="adm-err" id="panel-err" role="alert" hidden></p>
    </section>
  </main>

  <script src="../js/admin.js" defer></script>
</body>
</html>
